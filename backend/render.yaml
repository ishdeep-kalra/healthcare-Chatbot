services:
  - type: web
    name: healthcare-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Set this to your actual Vercel frontend URL(s) — no trailing slash, no wildcard
      # Example: ["https://your-project.vercel.app","https://your-custom-domain.com"]
      - key: CORS_ORIGINS
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ../data/chromadb
      - key: LOG_LEVEL
        value: info
