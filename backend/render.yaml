services:
  - type: web
    name: healthcare-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Set to your Vercel frontend URL(s). JSON array or comma-separated.
      # Example: ["https://healthcare-chatbot-ish7.vercel.app"]
      - key: CORS_ORIGINS
        value: '["https://healthcare-chatbot-ish7.vercel.app","http://localhost:5173","http://localhost:5174","http://localhost:3000"]'
      - key: CHROMA_PERSIST_DIR
        value: ../data/chromadb
      - key: LOG_LEVEL
        value: info
